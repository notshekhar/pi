# Build the release binaries when a version tag is pushed.
#
# The SQLite driver is cgo, so every target needs a C toolchain that can emit
# for it. Linux builds on Linux and macOS builds on macOS — but BOTH macOS
# architectures build on the arm64 runner, because Apple's clang targets
# x86_64 natively with `-arch` and the Intel runners are being retired. A job
# pinned to `macos-13` sat queued forever and the release never published.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            arch_flags: "-arch x86_64"
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Only where the binary can actually run. A cross-built darwin/amd64
      # cannot be executed on the arm64 runner that produced it.
      - if: ${{ !matrix.arch_flags }}
        run: go test ./...
      - name: build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_CFLAGS: ${{ matrix.arch_flags }}
          CGO_LDFLAGS: ${{ matrix.arch_flags }}
        run: |
          go build -trimpath -ldflags "-s -w" -o pi ./cmd/pi
          tar czf pi_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz pi
      - uses: actions/upload-artifact@v4
        with:
          name: pi_${{ matrix.goos }}_${{ matrix.goarch }}
          path: pi_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
